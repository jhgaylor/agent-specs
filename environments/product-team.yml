---
# Generic environment for the project-agnostic product engineering team.
# Mounts no repo — the `captain-picard` orchestrator clones the target
# bus repo on demand from the URL in the operator's first prompt. Secret
# surface mirrors `eng` so any product can use the same observability /
# infra MCPs without per-project plumbing.
#
# When a project gets sticky enough to warrant a permanent mount, copy this
# file to `environments/<project>.yml`, add the `repositories:` block, and
# point the orchestrator at the named env via `--env <project>`.
apiVersion: aod/v1
kind: Environment
metadata:
  name: product-team
spec:
  packages:
    apt:
      - jq
      - ripgrep
  networking_type: unrestricted
  secrets:
    GITHUB_TOKEN: infisical:///dev/GITHUB_TOKEN
    HONEYCOMB_API_KEY: infisical:///dev/HONEYCOMB_API_KEY
    POSTHOG_API_KEY: infisical:///dev/POSTHOG_API_KEY
    RENDER_API_KEY: infisical:///dev/RENDER_API_KEY
