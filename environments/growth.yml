---
# Environment for non-engineering roles working off product data and surfaces:
# product analysts, growth marketers, customer researchers. No repo mounted —
# these agents pull what they need from PostHog/Honeycomb/Render and write up
# findings. Same secrets surface as `eng` so an analyst who needs to push a
# write-up to a repo can still authenticate against GitHub.
apiVersion: fountain/v1
kind: Environment
metadata:
  name: growth
spec:
  packages:
    apt:
      - jq
      - ripgrep
      - curl
  networking_type: unrestricted
  secrets:
    GITHUB_TOKEN: infisical:///dev/GITHUB_TOKEN
    HONEYCOMB_API_KEY: infisical:///dev/HONEYCOMB_API_KEY
    POSTHOG_API_KEY: infisical:///dev/POSTHOG_API_KEY
    RENDER_API_KEY: infisical:///dev/RENDER_API_KEY
