---
# Environment for working on chant projects (github.com/INTENTIUS/chant) — the
# TypeScript-to-Kubernetes-YAML synthesis compiler. No repo mounted — chant
# projects are cloned on demand from the operator's first prompt, same
# pattern as `eng`/`product-team`. The k8s lexicon is pre-installed globally
# so `chant init --lexicon k8s` and friends work without a per-project
# `npm install` step.
apiVersion: fountain/v1
kind: Environment
metadata:
  name: chant
spec:
  packages:
    apt:
      - jq
  setup_script: npm install -g @intentius/chant-lexicon-k8s
  networking_type: unrestricted
  secrets:
    GITHUB_TOKEN: infisical:///dev/GITHUB_TOKEN
