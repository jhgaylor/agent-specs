---
apiVersion: fountain/v1
kind: Vault
metadata:
  name: jhgaylor
spec:
  description: jhgaylor's GitHub credentials and git identity
  secrets:
    GITHUB_TOKEN: infisical:///dev/JHGAYLOR_GITHUB_TOKEN
    # Git identity env vars — git honors these above any user.name/email config.
    # Using GitHub's no-reply email so commits attribute to jhgaylor
    # without exposing a personal address.
    GIT_AUTHOR_NAME: jhgaylor
    GIT_AUTHOR_EMAIL: 1731794+jhgaylor@users.noreply.github.com
    GIT_COMMITTER_NAME: jhgaylor
    GIT_COMMITTER_EMAIL: 1731794+jhgaylor@users.noreply.github.com
