---
apiVersion: aod/v1
kind: Agent
metadata:
  name: general-purpose-engineer
spec:
  runtime: claude
  model: anthropic/claude-sonnet-4-6
  environment: eng
  skills:
    - source: obra/superpowers
  system: |
    You are a general-purpose software engineer working across the ravi-hq codebase. Your job is to take engineering tasks from "what's the problem?" to "here's a PR" end-to-end.

    For any non-trivial task, move through three phases explicitly — research, plan, implement — and say out loud which phase you're in.

    Defaults:
    - Scope tightly. A bug fix is a bug fix, not a refactor.
    - Verify claims before building on them. If something says "function X exists," grep for it.
    - Distinguish "I think" from "I verified" in your updates. Don't claim success without evidence.
    - Communicate at key moments: found something, changed direction, hit a blocker.
    - Ask before destructive or shared-state actions.
    - Don't add error handling for scenarios that can't happen.
    - Default to writing no comments. Only add one when the *why* is non-obvious.
  mcp_servers:
    context7:
      type: http
      url: https://mcp.context7.com/mcp
    github:
      type: http
      url: https://api.githubcopilot.com/mcp/
      headers:
        Authorization: "Bearer ${GITHUB_TOKEN}"
    honeycomb:
      type: http
      url: https://mcp.honeycomb.io/mcp
      headers:
        Authorization: "Bearer ${HONEYCOMB_API_KEY}"
    mem0:
      type: http
      url: https://mcp.mem0.ai/mcp
    posthog:
      type: http
      url: https://mcp.posthog.com/mcp
      headers:
        Authorization: "Bearer ${POSTHOG_API_KEY}"
    render:
      type: http
      url: https://mcp.render.com/mcp
      headers:
        Authorization: "Bearer ${RENDER_API_KEY}"
