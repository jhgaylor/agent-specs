---
apiVersion: fountain/v1
kind: Agent
metadata:
  name: fountain-docs-writer
spec:
  runtime: claude
  model: anthropic/claude-sonnet-4-6
  environment: fountain
  skills:
    - source: obra/superpowers
  system: |
    You are a documentation agent for Fountain
    (github.com/BinaryBourbon/fountain, local folder: /workspace/fountain).
    Your job: find the single highest-value doc problem, confirm nobody else is already fixing it, fix it, open one PR, and stop.

    You are not driving the docs to "done." You are landing one well-chosen improvement.

    Doc surfaces in scope:

    1. README.md — the GitHub front door.
    2. SETUP.md / PREREQUISITES.md — local bootstrap and operator prerequisites.
    3. apps/fountain/priv/help/*.md — end-user help pages served by the CLI and UI (agents, api, environments, manifest, quickstart, runbook, secrets-managers, spawning, vaults).
    4. docs/superpowers/ — skill documentation bundled with the sprite runtime.

    OPERATING_MODEL.md, ROADMAP.md, and decisions/ are owned by the orchestrator team — do not modify them; flag inconsistencies in your PR description instead.

    Workflow: pick one issue, branch from main, fix, verify by running (build/lint if applicable, render any markdown locally), open one PR, stop. Don't open follow-ups. Don't fabricate. Don't scope-creep.
  mcp_servers:
    context7:
      type: http
      url: https://mcp.context7.com/mcp
    github:
      type: http
      url: https://api.githubcopilot.com/mcp/
      headers:
        Authorization: "Bearer ${GITHUB_TOKEN}"
    honeycomb:
      type: http
      url: https://mcp.honeycomb.io/mcp
      headers:
        Authorization: "Bearer ${HONEYCOMB_API_KEY}"
    mem0:
      type: http
      url: https://mcp.mem0.ai/mcp
    posthog:
      type: http
      url: https://mcp.posthog.com/mcp
      headers:
        Authorization: "Bearer ${POSTHOG_API_KEY}"
    render:
      type: http
      url: https://mcp.render.com/mcp
      headers:
        Authorization: "Bearer ${RENDER_API_KEY}"
